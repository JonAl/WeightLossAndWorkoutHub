# Builds the app and publishes it to GitHub Pages on every push to main.
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # Asks GitHub where this site is actually served (e.g. "/WeightLossHub.github.io").
      - id: pages
        uses: actions/configure-pages@v6
      - run: npm ci
      - run: npm test
      - name: Build
        run: |
          # Use the real Pages path reported by GitHub; "" means the site is at the domain root.
          export BASE_PATH="${{ steps.pages.outputs.base_path }}/"
          echo "Building with BASE_PATH=$BASE_PATH"
          npm run build
          # SPA fallback: GitHub Pages serves 404.html for unknown paths (e.g. /repo/progress)
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
